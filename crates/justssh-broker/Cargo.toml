[package]
name = "justssh-broker"
description = "The minimal broker acwbroker's blackbox harness drives: acwbroker's handoff pipe over justssh"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
justssh.workspace = true
justssh-keys.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
zeroize.workspace = true
subtle.workspace = true
rsa.workspace = true
rsa-rand-core.workspace = true
justssh-tokio = { path = "../justssh-tokio" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
justssh = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "test-util"] }

[lints]
workspace = true
