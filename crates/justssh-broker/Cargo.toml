[package]
name = "justssh-broker"
description = "The minimal broker acwbroker's blackbox harness drives: acwbroker's handoff pipe over justssh"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
justssh.workspace = true
justssh-keys.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
zeroize.workspace = true
subtle.workspace = true
justssh-tokio = { path = "../justssh-tokio" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }

[lints]
workspace = true
