[package]
name = "justssh-keys"
description = "Private key files for justssh: OpenSSH keys read and written, PPK and PEM keys read"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
# Test fixtures (keys, vectors) stay in the repo for CI; they are not shipped to crates.io.
exclude = ["tests/", "fuzz/"]

[dependencies]
justssh.workspace = true
justssh-wire.workspace = true
aes = { workspace = true, features = ["zeroize"] }
ctr.workspace = true
cbc = { version = "0.2", features = ["zeroize"] }
bcrypt-pbkdf = { version = "0.11", features = ["zeroize"] }
base64ct = { version = "1.8", features = ["alloc"] }
rsa.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
pkcs8 = "0.11"
sec1 = "0.8"
des = { version = "0.9", features = ["zeroize"] }
md-5 = { version = "0.11", features = ["zeroize"] }
# The big integers rsa 0.9 uses, for the CRT coefficient a written RSA key stores.
num-bigint-dig = { version = "0.8", features = ["zeroize"] }
getrandom = { workspace = true, features = ["sys_rng"] }
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
base64ct = { version = "1.8", features = ["alloc"] }

[lints]
workspace = true
