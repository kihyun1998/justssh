[package]
name = "justssh"
description = "Sans-IO SSH client and server: transport, authentication and connection state machines"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
justssh-wire.workspace = true
sha1.workspace = true
sha2 = { workspace = true, features = ["zeroize"] }
hmac.workspace = true
aes.workspace = true
ctr.workspace = true
aes-gcm.workspace = true
chacha20 = { workspace = true, features = ["legacy", "zeroize"] }
poly1305 = { workspace = true, features = ["zeroize"] }
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
ml-kem.workspace = true
crypto-bigint.workspace = true
rsa.workspace = true
rsa-sha1.workspace = true
rsa-sha2.workspace = true
rsa-rand-core.workspace = true
rand_core.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
justssh = { path = ".", features = ["test-support"] }
proptest.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[lints]
workspace = true

[features]
# Lets a Client send raw payloads and hand back raw received ones; for tests and fuzzing only.
test-support = []
