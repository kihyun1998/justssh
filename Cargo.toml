# justssh workspace: wire / core / tokio adapter, and key files on top (ADR-0003).
[workspace]
resolver = "2"
members = [
    "crates/justssh-wire",
    "crates/justssh",
    "crates/justssh-tokio",
    "crates/justssh-keys",
]
exclude = ["ci/coexist"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/justssh"

[workspace.dependencies]
justssh-wire = { path = "crates/justssh-wire" }
justssh = { path = "crates/justssh" }
justssh-keys = { path = "crates/justssh-keys" }

tokio = { version = "1", default-features = false }
proptest = "1"

# Crypto: latest stable RustCrypto releases only, rsa on 0.9 (ADR-0004).
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
aes = "0.9"
ctr = "0.10"
aes-gcm = "0.11"
chacha20 = "0.10"
poly1305 = "0.9"
ed25519-dalek = "3"
x25519-dalek = "3"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14", features = ["ecdh", "ecdsa"] }
p521 = { version = "0.14", features = ["ecdh", "ecdsa"] }
ml-kem = "0.3"
crypto-bigint = "0.7"
rsa = "0.9"
# The digest 0.10 generation rsa 0.9 works with; used only by RSA signing and verification (ADR-0004).
rsa-sha1 = { package = "sha1", version = "0.10", features = ["oid"] }
rsa-sha2 = { package = "sha2", version = "0.10", features = ["oid"] }
rsa-rand-core = { package = "rand_core", version = "0.6" }
rand_core = "0.10"
getrandom = "0.4"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# Public enums and structs are #[non_exhaustive]; configuration is built, not written as a literal.
[workspace.lints.clippy]
exhaustive_enums = "deny"
exhaustive_structs = "deny"

# The key derivations are slow unoptimised, and the key file tests run them many times.
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
