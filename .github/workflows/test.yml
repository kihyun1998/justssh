name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Start sshd for the client tests (crates/justssh-tokio/tests/sshd.rs)
        run: |
          if ! command -v sshd >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -yq openssh-server
          fi
          sudo useradd -m justssh
          echo 'justssh:justssh-ci-only' | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/justssh_host_ed25519
          common='ListenAddress 127.0.0.1
          HostKey /etc/ssh/justssh_host_ed25519
          PubkeyAuthentication no
          AllowUsers justssh'
          printf '%s\nPort 2201\nPidFile /run/sshd-password.pid\nUsePAM no\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\nClientAliveInterval 1\nClientAliveCountMax 2\n' "$common" | sudo tee /etc/ssh/justssh-password.conf
          printf '%s\nPort 2202\nPidFile /run/sshd-pam.pid\nUsePAM yes\nPasswordAuthentication no\nKbdInteractiveAuthentication yes\n' "$common" | sudo tee /etc/ssh/justssh-pam.conf
          sudo /usr/sbin/sshd -t -f /etc/ssh/justssh-password.conf
          sudo /usr/sbin/sshd -t -f /etc/ssh/justssh-pam.conf
          sudo /usr/sbin/sshd -f /etc/ssh/justssh-password.conf
          sudo /usr/sbin/sshd -f /etc/ssh/justssh-pam.conf

      - name: Start OpenSSH 8.7p1 (Rocky Linux 9, as RHEL 9) for the client tests
        run: |
          docker run -d --name rhel9-sshd -p 127.0.0.1:2203:22 docker.io/rockylinux/rockylinux:9.5@sha256:149fd31d916038eb1084d0e051537e279d7afcd5de0b365254e8fa3c3ef12bad bash -c \
            "dnf install -yq --disablerepo='*' --repofrompath=vault,https://dl.rockylinux.org/vault/rocky/9.5/BaseOS/x86_64/os/ --setopt=vault.gpgcheck=1 --setopt=vault.gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9 openssh-server && useradd -m justssh && echo 'justssh:justssh-ci-only' | chpasswd && ssh-keygen -A && exec /usr/sbin/sshd -D -e"
          for _ in $(seq 300); do
            docker logs rhel9-sshd 2>&1 | grep -q 'Server listening' && exit 0
            sleep 1
          done
          docker logs rhel9-sshd
          exit 1

      - name: Test
        env:
          JUSTSSH_REQUIRE_SSHD: "1"
          JUSTSSH_SSHD_PASSWORD_ADDR: 127.0.0.1:2201
          JUSTSSH_SSHD_PAM_ADDR: 127.0.0.1:2202
          JUSTSSH_SSHD_RHEL9_ADDR: 127.0.0.1:2203
          JUSTSSH_SSHD_USER: justssh
          JUSTSSH_SSHD_SECRET: justssh-ci-only
        run: cargo test --workspace

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: No pre-release crates in the dependency graph (ADR-0004)
        run: |
          if cargo tree --workspace -e normal --prefix none | grep -E -- '-(rc|pre|alpha|beta)'; then
            exit 1
          fi

  # justssh and IronRDP in one binary (ADR-0004).
  coexist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ci/coexist

      - name: Build justssh with IronRDP
        working-directory: ci/coexist
        run: cargo check
