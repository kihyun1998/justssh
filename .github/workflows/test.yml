name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy for Windows (the broker's caller measurement, crates/justssh-broker/src/peer/windows.rs)
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy -p justssh-broker --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: ci/go-interop/go.sum

      - name: Start sshd for the client tests (crates/justssh-tokio/tests/sshd.rs)
        run: |
          if ! command -v sshd >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -yq openssh-server
          fi
          sudo useradd -m justssh
          echo 'justssh:justssh-ci-only' | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/justssh_host_ed25519
          mkdir -p /tmp/justssh-keys
          common='ListenAddress 127.0.0.1
          HostKey /etc/ssh/justssh_host_ed25519
          AllowUsers justssh'
          keys='PubkeyAuthentication yes
          AuthorizedKeysFile /tmp/justssh-keys/authorized_keys
          TrustedUserCAKeys /tmp/justssh-keys/ca.pub
          StrictModes no
          UsePAM no
          PasswordAuthentication no
          KbdInteractiveAuthentication no'
          printf '%s\nPort 2201\nPidFile /run/sshd-password.pid\nPubkeyAuthentication no\nUsePAM no\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\nClientAliveInterval 1\nClientAliveCountMax 2\nKexAlgorithms +diffie-hellman-group14-sha256,diffie-hellman-group14-sha1\nMACs +hmac-sha1-96\n' "$common" | sudo tee /etc/ssh/justssh-password.conf
          printf '%s\nPort 2202\nPidFile /run/sshd-pam.pid\nPubkeyAuthentication no\nUsePAM yes\nPasswordAuthentication no\nKbdInteractiveAuthentication yes\n' "$common" | sudo tee /etc/ssh/justssh-pam.conf
          sudo ssh-keygen -q -t rsa -b 2048 -N '' -f /etc/ssh/justssh_host_rsa
          sudo ssh-keygen -q -t ecdsa -b 384 -N '' -f /etc/ssh/justssh_host_ecdsa384
          sudo ssh-keygen -q -t ecdsa -b 521 -N '' -f /etc/ssh/justssh_host_ecdsa521
          printf '%s\nPort 2207\nPidFile /run/sshd-hostkeys.pid\nHostKey /etc/ssh/justssh_host_rsa\nHostKey /etc/ssh/justssh_host_ecdsa384\nHostKey /etc/ssh/justssh_host_ecdsa521\nHostKeyAlgorithms +ssh-rsa\nPubkeyAuthentication no\nUsePAM no\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\n' "$common" | sudo tee /etc/ssh/justssh-hostkeys.conf
          printf '%s\nPort 2208\nPidFile /run/sshd-rekey.pid\nRekeyLimit 4K\nPubkeyAuthentication no\nUsePAM no\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\n' "$common" | sudo tee /etc/ssh/justssh-rekey.conf
          printf '%s\n%s\nPort 2204\nPidFile /run/sshd-keys.pid\n' "$common" "$keys" | sudo tee /etc/ssh/justssh-keys.conf
          printf '%s\n%s\nPort 2205\nPidFile /run/sshd-keys-ssh-rsa.pid\nPubkeyAcceptedAlgorithms ssh-rsa,ssh-rsa-cert-v01@openssh.com\n' "$common" "$keys" | sudo tee /etc/ssh/justssh-keys-ssh-rsa.conf
          for c in password pam keys keys-ssh-rsa hostkeys rekey; do
            sudo /usr/sbin/sshd -t -f /etc/ssh/justssh-$c.conf
          done
          for c in password pam keys keys-ssh-rsa hostkeys rekey; do
            sudo /usr/sbin/sshd -f /etc/ssh/justssh-$c.conf
          done

      - name: Start OpenSSH 8.7p1 (Rocky Linux 9, as RHEL 9) for the client tests
        run: |
          docker run -d --name rhel9-sshd -p 127.0.0.1:2203:22 -v /tmp/justssh-keys:/tmp/justssh-keys:ro docker.io/rockylinux/rockylinux:9.5@sha256:149fd31d916038eb1084d0e051537e279d7afcd5de0b365254e8fa3c3ef12bad bash -c \
            "dnf install -yq --disablerepo='*' --repofrompath=vault,https://dl.rockylinux.org/vault/rocky/9.5/BaseOS/x86_64/os/ --setopt=vault.gpgcheck=1 --setopt=vault.gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9 openssh-server && useradd -m justssh && echo 'justssh:justssh-ci-only' | chpasswd && ssh-keygen -A && exec /usr/sbin/sshd -D -e -o StrictModes=no -o AuthorizedKeysFile=/tmp/justssh-keys/authorized_keys -o TrustedUserCAKeys=/tmp/justssh-keys/ca.pub"
          for _ in $(seq 300); do
            docker logs rhel9-sshd 2>&1 | grep -q 'Server listening' && exit 0
            sleep 1
          done
          docker logs rhel9-sshd
          exit 1

      - name: Start OpenSSH 9.9p2 (Alpine 3.21) for the client tests
        run: |
          docker run -d --name alpine-sshd -p 127.0.0.1:2206:22 docker.io/library/alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507 sh -c \
            "apk add -q 'openssh-server~9.9' && adduser -D justssh && echo 'justssh:justssh-ci-only' | chpasswd && ssh-keygen -A && exec /usr/sbin/sshd -D -e -o PasswordAuthentication=yes"
          for _ in $(seq 300); do
            docker logs alpine-sshd 2>&1 | grep -q 'Server listening' && exit 0
            sleep 1
          done
          docker logs alpine-sshd
          exit 1

      - name: Test
        env:
          JUSTSSH_REQUIRE_SSHD: "1"
          JUSTSSH_REQUIRE_GO: "1"
          JUSTSSH_SSHD_PASSWORD_ADDR: 127.0.0.1:2201
          JUSTSSH_SSHD_PAM_ADDR: 127.0.0.1:2202
          JUSTSSH_SSHD_RHEL9_ADDR: 127.0.0.1:2203
          JUSTSSH_SSHD_KEYS_ADDR: 127.0.0.1:2204
          JUSTSSH_SSHD_SSH_RSA_ADDR: 127.0.0.1:2205
          JUSTSSH_SSHD_KEYS_DIR: /tmp/justssh-keys
          JUSTSSH_SSHD_MLKEM_ADDR: 127.0.0.1:2206
          JUSTSSH_SSHD_HOSTKEYS_ADDR: 127.0.0.1:2207
          JUSTSSH_SSHD_REKEY_ADDR: 127.0.0.1:2208
          JUSTSSH_SSHD_USER: justssh
          JUSTSSH_SSHD_SECRET: justssh-ci-only
        run: cargo test --workspace

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: No pre-release crates in the dependency graph (ADR-0004)
        run: |
          if cargo tree --workspace -e normal --prefix none | grep -E -- '-(rc|pre|alpha|beta)'; then
            exit 1
          fi

  # justssh and IronRDP in one binary (ADR-0004).
  coexist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ci/coexist

      - name: Build justssh with IronRDP
        working-directory: ci/coexist
        run: cargo check
