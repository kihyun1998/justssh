name: release

# Publishes the library crates to crates.io on a v* tag through Trusted Publishing, in
# dependency order, skipping a crate whose version crates.io already has. How a release is
# cut and why the workflow is this way: docs/map/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # mint the OIDC token Trusted Publishing exchanges
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Mint a crates.io token (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in justssh-wire justssh justssh-keys justssh-tokio; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "justssh-release (https://github.com/kihyun1998/justssh)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is already on crates.io, skipped"; continue ;;
              404) ;;
              *) echo "::error::crates.io answered $status for $crate $version"; exit 1 ;;
            esac
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
          done
