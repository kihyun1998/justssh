# Coverage-guided fuzzing of the wire decoders and the transport's message table (#14), nightly
# and on demand; never a pull-request gate. libFuzzer needs nightly and does not run on the
# Windows MSVC host, so this lane is Ubuntu only. The inputs kept in fuzz/regressions/ are
# replayed on every pull request by crates/justssh/tests/fuzz_regressions.rs instead.
name: fuzz

on:
  schedule:
    - cron: "37 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The targets are the files in fuzz/fuzz_targets/, each of which must have a [[bin]].
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the targets in fuzz/fuzz_targets/
        id: derive
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          files = sorted(p.stem for p in pathlib.Path("fuzz/fuzz_targets").glob("*.rs"))
          manifest = pathlib.Path("fuzz/Cargo.toml").read_text(encoding="utf-8")
          declared = set(re.findall(r'^path = "fuzz_targets/(.+?)\.rs"$', manifest, re.M))
          bad = False
          for n in sorted(set(files) - declared):
              print(f"::error::fuzz_targets/{n}.rs has no [[bin]] in fuzz/Cargo.toml")
              bad = True
          for n in sorted(declared - set(files)):
              print(f"::error::fuzz/Cargo.toml declares {n}, but fuzz_targets/{n}.rs is absent")
              bad = True
          if not files:
              print("::error::fuzz/fuzz_targets/ is empty")
              bad = True
          if bad:
              sys.exit(1)
          print("targets:", *files)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(files)}\n")
          PY

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # The kept regressions go in as a second, read-only corpus.
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} regressions/${{ matrix.target }} -- -max_total_time=300 -timeout=10

      - name: Save the corpus
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
